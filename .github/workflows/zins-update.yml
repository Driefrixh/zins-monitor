name: Zins-Update

on:
  schedule:
    # 15:10 UTC = 17:10 MESZ / 16:10 MEZ, Montag bis Freitag.
    # Die EZB veroeffentlicht die Zinskurve an TARGET-Handelstagen um die
    # Mittagszeit; der spaete Lauf laesst Puffer.
    # Hinweis: GitHub-Cron-Laeufe koennen sich um Minuten bis Stunden
    # verschieben - das ist bei Tagesdaten unkritisch.
    - cron: "10 15 * * 1-5"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Nachricht auch ohne neuen Handelstag schicken"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: zins-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zinsen abrufen und Nachricht schicken
        env:
          # Geheimer Themenname, z. B. zins-d4k9x2mq
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Nur noetig bei eigenem ntfy-Server oder reserviertem Topic
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # Ab dieser Tagesveraenderung wird die Nachricht als Alarm
          # markiert und mit Ton zugestellt (in Basispunkten).
          ALERT_BP: "10"
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: python scripts/fetch_rates.py

      - name: Daten committen
        run: |
          git config user.name  "zins-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Zinsen: Stand $(date -u +%F)"
            git push
          fi
